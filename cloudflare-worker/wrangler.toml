name = "slugger-turn-ice"
main = "worker.js"
compatibility_date = "2026-10-22"

# Configure these non-secret values in the Cloudflare dashboard after deployment.
[vars]
METERED_DOMAIN = "YOUR_APP.metered.live"
ALLOWED_ORIGINS = "https://YOUR_GITHUB_USERNAME.github.io"

# Add the Metered credential-scoped API key separately as a Cloudflare Worker secret:
# npx wrangler secret put METERED_CREDENTIAL_API_KEY
