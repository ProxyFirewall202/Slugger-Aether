const AUTH = { user:null, username:null, guest:false, mode:'login' };
function authTab(mode){
  AUTH.mode = mode;
  $('authTabLogin').classList.toggle('on', mode==='login');

async function authSubmit(){
  const err = m => { $('authError').textContent = m; };
  err('');
  if (!FIREBASE_CONFIGURED || !fbAuth) { err('Firebase not configured. Use Guest Mode.'); return; }
  const email = $('authEmail').value.trim();
  const pw = $('authPassword').value;
  const un = $('authUsername').value.trim();
  if (!email || !pw) { err('Email and password required.'); return; }
  if (pw.length < 6) { err('Password must be at least 6 characters.'); return; }
  if (AUTH.mode === 'register' && !un) { err('Username required.'); return; }
  $('authSubmitBtn').disabled = true;
  try {
    if (AUTH.mode === 'register') {
      const cred = await fbAuth.createUserWithEmailAndPassword(email, pw);
      await cred.user.updateProfile({ displayName: un });
      AUTH.user = cred.user; AUTH.username = un;
      await fbDb.collection('users').doc(cred.user.uid).set({
        username: un, email: email, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } else {
      const cred = await fbAuth.signInWithEmailAndPassword(email, pw);
      AUTH.user = cred.user;
      AUTH.username = cred.user.displayName || email.split('@')[0];
    }
    await loadCloudSave();
    enterGame();
  } catch (e) {
    const msg = (e.code || e.message || '').toString();
    if (msg.includes('user-not-found')) err('No account with that email.');

    else if (msg.includes('email-already-in-use')) err('That email is already registered.');
    else if (msg.includes('invalid-email')) err('Invalid email address.');

/* ============ CLOUD SAVE (v0.4.2 PROGRESS-BASED) ============ */
let cloudSaveTimer = null, cloudSavePending = false;

// Evaluates how "progressed" a save file is
function saveScore(s) {
  if (!s) return 0;
  let score = 0;
  // Checkpoints unlocked (most important)
  if (s.cp && s.cp.length) score += Math.max(...s.cp) * 100000;
  // Highest wave reached
  score += (s.hi || 0) * 1000;
  // Currencies
  score += (s.warp || 0) + (s.pro || 0) * 10 + (s.cell || 0) * 50 + (s.pur || 0) * 50 + (s.souls || 0) * 5;
  // Inventory size (unique items)
  score += Object.keys(s.inv || {}).length * 2000;
  // Upgrade levels
  if (s.up) score += Object.values(s.up).reduce((a,b)=>a+b, 0) * 5000;
  return score;
}

function cloudSaveDebounced(){
  if (!fbDb || !AUTH.user) return;
  cloudSavePending = true;
  if (cloudSaveTimer) return;
  cloudSaveTimer = setTimeout(async () => {
    cloudSaveTimer = null;
    if (!cloudSavePending) return;
    cloudSavePending = false;
    try {
      await fbDb.collection('saves').doc(AUTH.user.uid).set({
        data: S, lastSaveTimestamp: S.lastSaveTimestamp,
        username: AUTH.username, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch(e) { console.warn('Cloud save failed:', e); }
  }, 2500);
}

async function loadCloudSave(){
  if (!fbDb || !AUTH.user) return;
  try {
    const doc = await fbDb.collection('saves').doc(AUTH.user.uid).get();
    if (!doc.exists) { cloudSaveDebounced(); return; }
    
    const cloudData = doc.data().data;
    const localScore = saveScore(S);
    const cloudScore = saveScore(cloudData);

    if (cloudScore > localScore) {
      // Cloud has more progress, load it
      S = Object.assign(DEF(), cloudData);
      try { localStorage.setItem(SK, JSON.stringify(S)); } catch(e) {}

function netConnect(arg){
  let t=arg;if(typeof arg!=='string'){const el=$('netTarget');t=el?el.value:''}
  if(!t)return;
  let raw=t.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(raw.startsWith('SLUG'))raw=raw.slice(4);
  const id='SLUG-'+raw;
  if(!/^SLUG-[A-Z0-9]{4}$/.test(id)){netSys('Invalid ID (expected SLUG-XXXX)');return}
  if(NET.conns[id]){netSys('Already connected to '+id);return}
  if(!NET.peer||!NET.ready){netSys('Network not ready');return}
